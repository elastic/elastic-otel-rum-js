# Possibly label some incoming issues/PRs.
# pull_request_target is kept on purpose: it is the only trigger that gives PRs from forks a
# token that can write labels. No PR code is checked out or run; the job only calls the
# GitHub API with event metadata (actor, PR number).
name: "labeler"
on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  categorize-issues-and-prs:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write # create-token (vault login via OIDC)
      issues: write # addLabels with the default token
      pull-requests: write
    steps:
    - name: Get token
      id: get_token
      uses: elastic/oblt-actions/github/create-token@208d03b3c3dfec874e5f2d73b2c938e493fc6953 # v1.43.0

    - id: is_elastic_member
      uses: elastic/oblt-actions/github/is-member-of@208d03b3c3dfec874e5f2d73b2c938e493fc6953 # v1.43.0
      with:
        github-org: "elastic"
        github-user: ${{ github.actor }}
        github-token: ${{ steps.get_token.outputs.token }}

    - name: Add community and triage labels
      if: contains(steps.is_elastic_member.outputs.result, 'false') && github.actor != 'dependabot[bot]' && github.actor != 'elastic-renovate-prod[bot]' && github.actor != 'elastic-observability-automation[bot]'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          github.rest.issues.addLabels({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            labels: ["community", "triage"]
          })

