<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EDOT Browser Monitor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="euiBody">
    <main class="euiPage">
      <header class="euiPageHeader">
        <h1 class="euiTitle euiTitle--m">Monitored websites</h1>
        <p class="euiText euiText--s euiTextColor--subdued">
          Inject EDOT Browser when a tab matches the configured host.
        </p>
      </header>

      <div class="euiPanel euiPanel--paddingMedium" role="region" aria-label="Website configuration">
        <h2 class="euiTitle euiTitle--s">Add or edit entry</h2>

        <form id="website-form" class="euiForm" autocomplete="off">
          <input type="hidden" id="website-id" name="id" value="" />

          <div class="euiFormRow">
            <label class="euiFormLabel" for="host">Host</label>
            <div class="euiFormControlLayout">
              <input
                class="euiFieldText"
                id="host"
                name="host"
                type="text"
                placeholder="example.com"
                required
              />
            </div>
          </div>

          <div class="euiFormRow">
            <label class="euiFormLabel" for="version">EDOT version</label>
            <div class="euiFormControlLayout">
              <input
                class="euiFieldText"
                id="version"
                name="version"
                type="text"
                placeholder="0.4.0"
                required
              />
            </div>
          </div>

          <div class="euiFormRow">
            <label class="euiFormLabel" for="endpoint">OTLP endpoint</label>
            <div class="euiFormControlLayout">
              <input
                class="euiFieldText"
                id="endpoint"
                name="endpoint"
                type="url"
                placeholder="https://…/otlp"
                required
              />
            </div>
          </div>

          <div class="euiFormRow">
            <label class="euiFormLabel" for="api_key">API key</label>
            <div class="euiFormControlLayout">
              <input
                class="euiFieldText"
                id="api_key"
                name="api_key"
                type="password"
                placeholder="ApiKey value"
                required
              />
            </div>
          </div>

          <div class="euiFormRow">
            <label class="euiFormLabel" for="service_name">Service name</label>
            <div class="euiFormControlLayout">
              <input
                class="euiFieldText"
                id="service_name"
                name="service_name"
                type="text"
                placeholder="my-service"
                required
              />
            </div>
          </div>

          <div class="euiFormRow">
            <label class="euiFormLabel" for="service_version">Service version</label>
            <div class="euiFormControlLayout">
              <input
                class="euiFieldText"
                id="service_version"
                name="service_version"
                type="text"
                placeholder="0.0.1"
                required
              />
            </div>
          </div>

          <div class="euiFlexGroup euiFlexGroup--gutterMedium euiFormRow--compressed">
            <div class="euiFlexItem euiFlexItem--growZero">
              <button type="submit" id="save-btn" class="euiButton euiButton--fill euiButton--primary">
                Save website
              </button>
            </div>
            <div class="euiFlexItem euiFlexItem--growZero">
              <button type="button" id="reset-btn" class="euiButton euiButton--empty euiButton--primary">
                Clear form
              </button>
            </div>
          </div>
        </form>
      </div>

      <section class="euiPageSection" aria-labelledby="saved-entries-heading">
        <h2 id="saved-entries-heading" class="euiTitle euiTitle--s">Saved entries</h2>
        <ul id="website-list" class="euiList"></ul>
      </section>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
